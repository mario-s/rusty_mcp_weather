[package]
name = "rusty_mcp_weather"
version = "0.1.0"
edition = "2024"

[dependencies]
progenitor-client = "0.15"
anyhow = "1.0.104"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", features = ["reqwest", "transport-io", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
schemars = "1.2.2"
openweathermap_client = "0.7.0"

